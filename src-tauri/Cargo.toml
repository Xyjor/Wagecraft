[package]
name = "wagecraft"
version = "0.1.0"
description = "Philippine payroll desktop app"
authors = ["Plue Truslow"]
license = "MIT"
edition = "2021"
# `pnpm tauri dev` and `cargo run` start the app; the seed tool is `--bin seed`.
default-run = "wagecraft"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wagecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
tauri-plugin-log = "2"
ts-rs = "10"
argon2 = { version = "0.5", features = ["std"] }
chrono = "0.4"
csv = "1"
tauri-plugin-dialog = "2"
rust_decimal = "1"
rust_decimal_macros = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
